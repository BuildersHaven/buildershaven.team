<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Builder´s Haven - Teamlist</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100%;
      background-color: #272a33;
    }
    .container {
      display: flex;
      height: 100vh;
    }
    /* Sidebar erhält position: relative, damit der Refresh-Button absolut darin positioniert werden kann */
    .sidebar {
      position: relative;
      width: 220px;
      background-color: #272a33;
      padding: 15px;
      overflow-y: auto;
    }
    .main-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      position: relative;
    }
    #loggedInUser {
      font-weight: bold;
      margin-bottom: 10px;
    }
    .card {
      width: 190px;
      background-color: rgba(36, 40, 50, 1);
      background-image: linear-gradient(139deg, rgba(36, 40, 50, 1) 0%, rgba(36, 40, 50, 1) 0%, rgba(37, 28, 40, 1) 100%);
      border-radius: 10px;
      padding: 15px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .card .separator {
      border-top: 1.5px solid #42434a;
      margin: 5px 0;
    }
    .card .list {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 10px;
      margin: 0;
    }
    .card .list .element {
      display: flex;
      align-items: center;
      color: #7e8590;
      gap: 10px;
      transition: all 0.3s ease-out;
      padding: 4px 7px;
      border-radius: 6px;
      cursor: pointer;
    }
    .card .list .element svg {
      width: 19px;
      height: 19px;
      transition: all 0.3s ease-out;
    }
    .card .list .element .label {
      font-weight: 600;
    }
    .card .list .element:hover {
      background-color: #5353ff;
      color: #ffffff;
      transform: translate(1px, -1px);
    }
    .card .list .delete:hover {
      background-color: #8e2a2a;
    }
    .card .list .element:active {
      transform: scale(0.99);
    }
    .card .list:not(:last-child) .element:hover svg {
      stroke: #ffffff;
    }
    .card .list:last-child svg {
      stroke: #bd89ff;
    }
    .card .list:last-child .element {
      color: #bd89ff;
    }
    .card .list:last-child .element:hover {
      background-color: rgba(56, 45, 71, 0.84);
    }
    .folder {
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f8f8f8;
      overflow: hidden;
    }
    .folder-header {
      background: #e0e0e0;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .folder-header:hover {
      background: #d0d0d0;
    }
    .folder-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: none;
    }
    .folder-list.open {
      display: block;
    }
    .folder-list li {
      padding: 8px 10px;
      border-top: 1px solid #eee;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .folder-list li:hover {
      background-color: #ddd;
    }
    .info-form {
      margin-top: 20px;
      max-width: 500px;
    }
    .info-form label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    .info-form input,
    .info-form textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .password-container {
      display: flex;
      align-items: center;
    }
    .password-container input {
      flex: 1;
    }
    .password-container button {
      margin-left: 5px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .login-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .login-box {
      background-color: #1e2331;
      padding: 20px 30px;
      border-radius: 5px;
      width: 300px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      text-align: center;
    }
    .login-box input {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .login-box button {
      padding: 8px 16px;
      border: none;
      background-color: #22365e;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    .bin-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background-color: rgb(255, 95, 95);
      cursor: pointer;
      border: 2px solid rgb(255, 201, 201);
      transition-duration: 0.3s;
      position: relative;
      overflow: hidden;
      margin-left: 10px;
    }
    .bin-bottom {
      width: 15px;
      z-index: 2;
    }
    .bin-top {
      width: 17px;
      transform-origin: right;
      transition-duration: 0.3s;
      z-index: 2;
    }
    .bin-button:hover .bin-top {
      transform: rotate(45deg);
    }
    .bin-button:hover {
      background-color: rgb(255, 0, 0);
    }
    .bin-button:active {
      transform: scale(0.9);
    }
    .garbage {
      position: absolute;
      width: 14px;
      height: auto;
      z-index: 1;
      opacity: 0;
      transition: all 0.3s;
    }
    .TextColorWhite {
      color: white;
    }
    .bin-button:hover .garbage {
      animation: throw 0.4s linear;
    }
    @keyframes throw {
      from {
        transform: translate(-400%, -700%);
        opacity: 0;
      }
      to {
        transform: translate(0%, 0%);
        opacity: 1;
      }
    }

    /* Logout-Button CSS – unverändert */
    .logout-button {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 200;
    }
    .Btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition-duration: .3s;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.199);
      background-color: rgb(255, 65, 65);
    }
    .sign {
      width: 100%;
      transition-duration: .3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sign svg {
      width: 17px;
    }
    .sign svg path {
      fill: white;
    }
    .text {
      position: absolute;
      right: 0%;
      width: 0%;
      opacity: 0;
      color: white;
      font-size: 1.2em;
      font-weight: 600;
      transition-duration: .3s;
    }
    .Btn:hover {
      width: 125px;
      border-radius: 40px;
      transition-duration: .3s;
    }
    .Btn:hover .sign {
      width: 30%;
      transition-duration: .3s;
      padding-left: 20px;
    }
    .Btn:hover .text {
      opacity: 1;
      width: 70%;
      transition-duration: .3s;
      padding-right: 10px;
    }
    .Btn:active {
      transform: translate(2px ,2px);
    }

    /* Save-Button CSS – wie zuvor */
    .save-btn-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
    }
    .save-btn-container a {
      color: rgba(255, 255, 255, 0.692);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.397);
      background: rgba(255, 255, 255, 0.068);
      overflow: hidden;
      font-size: 0.9rem;
      font-weight: 600;
      gap: 8px;
      border-radius: 5px;
      margin: 0 5px;
      transition: 0.2s;
      border: 1px solid transparent;
      text-decoration: none;
    }
    .save-btn-container a:hover {
      border-color: rgba(255, 255, 255, 0.623);
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.144),
        rgba(255, 255, 255, 0.247),
        rgba(255, 255, 255, 0.39)
      );
      box-shadow: 0 6px rgba(255, 255, 255, 0.623);
      transform: translateY(-6px);
    }
    .save-btn-container a:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* Refresh-Button CSS – nun in der Sidebar */
    .refresh-btn-sidebar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 200;
    }
    .refresh-btn-sidebar .button {
      color: white;
      background-color: #222;
      font-weight: 500;
      border-radius: 0.5rem;
      font-size: 1rem;
      line-height: 2rem;
      padding: 0.7rem 2rem;
      cursor: pointer;
      text-align: center;
      margin-right: 0.5rem;
      display: inline-flex;
      align-items: center;
      border: none;
    }
    .refresh-btn-sidebar .button:hover {
      background-color: #333;
    }
    .refresh-btn-sidebar .button svg {
      display: inline;
      width: 1.3rem;
      height: 1.3rem;
      margin-right: 0.75rem;
      color: white;
    }
    .refresh-btn-sidebar .button:focus svg {
      animation: spin_357 0.5s linear;
    }
    @keyframes spin_357 {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

    <div class="main-content">
      <div id="loggedInUser" class="TextColorWhite"></div>
      <div id="folderContainer"></div>
      <div id="memberInfo" class="info-form">
        <h3 class="TextColorWhite">Mitglieder Infos</h3>
        <label for="memberName" class="TextColorWhite">Name</label>
        <input class="TextColorWhite" type="text" id="memberName" placeholder="Name" disabled />
  
        <label for="memberRank" class="TextColorWhite">Rank</label>
        <input type="text" id="memberRank" placeholder="Rank" />
  
        <label for="memberPassword" class="TextColorWhite">Passwort</label>
        <div class="password-container">
          <input type="password" id="memberPassword" placeholder="Passwort" readonly />
          <button type="button" id="togglePasswordButton">Anzeigen</button>
          <button type="button" id="copyPasswordButton">Kopieren</button>
        </div>

        <textarea id="memberInfoField" placeholder="Info" rows="5"></textarea>

        <a id="saveButton" title="Speichern">
          <svg viewBox="0 0 256 256" height="32" width="38" xmlns="http://www.w3.org/2000/svg">
            <path d="M74.34 85.66a8 8 0 0 1 11.32-11.32L120 108.69V24a8 8 0 0 1 16 0v84.69l34.34-34.35a8 8 0 0 1 11.32 11.32l-48 48a8 8 0 0 1-11.32 0ZM240 136v64a16 16 0 0 1-16 16H32a16 16 0 0 1-16-16v-64a16 16 0 0 1 16-16h52.4a4 4 0 0 1 2.83 1.17L111 145a24 24 0 0 0 34 0l23.8-23.8a4 4 0 0 1 2.8-1.2H224a16 16 0 0 1 16 16m-40 32a12 12 0 1 0-12 12a12 12 0 0 0 12-12" fill="currentColor"></path>

  <script>
    const generalPassword = "buildershaven.team.password.pass-13072024";
    let teamMembers = [];
    let selectedMemberIndex = null;
    let currentUserName = "";
    
    function loadTeamMembers() {
      const stored = localStorage.getItem('teamMembers');
      teamMembers = stored ? JSON.parse(stored) : [];
    }
    function saveTeamMembers() {
      localStorage.setItem('teamMembers', JSON.stringify(teamMembers));
    }
    
    function renderFolderStructure() {
      const container = document.getElementById('folderContainer');
      container.innerHTML = "";
      const groups = {};
      teamMembers.forEach((member, idx) => {
        let rank = (member.rank && member.rank.trim() !== "") ? member.rank : "Ohne Rank";
        if (!groups[rank]) groups[rank] = [];
        groups[rank].push({ member, idx });
      });
      for (const rank in groups) {
        const folderDiv = document.createElement('div');
        folderDiv.classList.add("folder");
        const headerDiv = document.createElement('div');
        headerDiv.classList.add("folder-header");
        headerDiv.innerHTML = `<span>${rank}</span> <span class="toggle-folder">[-]</span>`;
        folderDiv.appendChild(headerDiv);
        const ul = document.createElement('ul');
        ul.classList.add("folder-list", "open");
        groups[rank].forEach(obj => {
          const li = document.createElement('li');
          li.addEventListener('click', () => {
            selectedMemberIndex = obj.idx;
            loadMemberInfo(obj.member);
          });
          const nameSpan = document.createElement('span');
          nameSpan.classList.add("member-name");
          nameSpan.textContent = obj.member.name;
          li.appendChild(nameSpan);

          const binButton = document.createElement('button');
          binButton.classList.add("bin-button");
          binButton.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 39 7" class="bin-top">
              <line stroke-width="4" stroke="white" y2="5" x2="39" y1="5"></line>
              <line stroke-width="3" stroke="white" y2="1.5" x2="26.0357" y1="1.5" x1="12"></line>
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 33 39" class="bin-bottom">
              <mask fill="white" id="path-1-inside-1_8_19">
                <path d="M0 0H33V35C33 37.2091 31.2091 39 29 39H4C1.79086 39 0 37.2091 0 35V0Z"></path>
              </mask>
              <path mask="url(#path-1-inside-1_8_19)" fill="white" d="M0 0H33H0ZM37 35C37 39.4183 33.4183 43 29 43H4C-0.418278 43 -4 39.4183 -4 35H4H29H37ZM4 43C-0.418278 43 -4 39.4183 -4 35V0H4V35V43ZM37 0V35C37 39.4183 33.4183 43 29 43V35V0H37Z"></path>
              <path stroke-width="4" stroke="white" d="M12 6L12 29"></path>
              <path stroke-width="4" stroke="white" d="M21 6V29"></path>
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 89 80" class="garbage">
              <path fill="white" d="M20.5 10.5L37.5 15.5L42.5 11.5L51.5 12.5L68.75 0L72 11.5L79.5 12.5H88.5L87 22L68.75 31.5L75.5066 25L86 26L87 35.5L77.5 48L70.5 49.5L80 50L77.5 71.5L63.5 58.5L53.5 68.5L65.5 70.5L45.5 73L35.5 79.5L28 67L16 63L12 51.5L0 48L16 25L22.5 17L20.5 10.5Z"></path>
            </svg>
          `;
          binButton.addEventListener('click', (e) => {
            e.stopPropagation();
            if (confirm("Mitglied wirklich löschen?")) {
              if (selectedMemberIndex === obj.idx) {
                clearMemberForm();
                selectedMemberIndex = null;
              }
              teamMembers.splice(obj.idx, 1);
              saveTeamMembers();
              renderFolderStructure();
            }
          });
          li.appendChild(binButton);
          ul.appendChild(li);
        });
        folderDiv.appendChild(ul);
        container.appendChild(folderDiv);
        headerDiv.addEventListener('click', () => {
          if (ul.classList.contains("open")) {
            ul.classList.remove("open");
            ul.style.display = "none";
            headerDiv.querySelector(".toggle-folder").textContent = "[+]";
          } else {
            ul.classList.add("open");
            ul.style.display = "block";
            headerDiv.querySelector(".toggle-folder").textContent = "[-]";
          }
        });
      }
    }

    function loadMemberInfo(member) {
      document.getElementById('memberName').value = member.name;
      document.getElementById('memberRank').value = member.rank || "";
      document.getElementById('memberPassword').value = generalPassword;
      document.getElementById('memberInfoField').value = member.info || "";
      document.getElementById('memberWeiteres').value = member.weiteres || "";
      const pwInput = document.getElementById('memberPassword');
      pwInput.type = "password";
      document.getElementById('togglePasswordButton').textContent = "Anzeigen";
    }
    function clearMemberForm() {
      document.getElementById('memberName').value = "";
      document.getElementById('memberRank').value = "";
      document.getElementById('memberPassword').value = "";
      document.getElementById('memberInfoField').value = "";
      document.getElementById('memberWeiteres').value = "";
    }
    
    document.getElementById('loginButton').addEventListener('click', () => {
      const name = document.getElementById('loginName').value.trim();
      const pw = document.getElementById('loginPassword').value.trim();
      if (!name || !pw) {
        alert("Bitte Name und Passwort eingeben!");
        return;
      }
      if (pw === generalPassword) {
        currentUserName = name;
        document.getElementById('loggedInUser').textContent = "Angemeldet als: " + currentUserName;
        document.getElementById('loginContainer').style.display = "none";
        document.getElementById('mainContainer').style.display = "flex";
        loadTeamMembers();
        renderFolderStructure();
      } else {
        alert("Falsches Passwort!");
      }
    });

    document.getElementById('addMemberBtn').addEventListener('click', () => {
      const newName = prompt("Name des neuen Mitglieds:");
      if (!newName) return;
      const newMember = { name: newName, rank: "", info: "", weiteres: "" };
      teamMembers.push(newMember);
      saveTeamMembers();
      renderFolderStructure();
    });
    document.getElementById('renameBtn').addEventListener('click', () => {
      if (selectedMemberIndex === null) {
        alert("Kein Mitglied ausgewählt!");
        return;
      }
      const newName = prompt("Neuen Namen eingeben:", teamMembers[selectedMemberIndex].name);
      if (!newName) return;
      teamMembers[selectedMemberIndex].name = newName;
      saveTeamMembers();
      renderFolderStructure();
    });
    document.getElementById('deleteBtn').addEventListener('click', () => {
      if (selectedMemberIndex === null) {
        alert("Kein Mitglied ausgewählt!");
        return;
      }
      if (confirm("Mitglied wirklich löschen?")) {
        teamMembers.splice(selectedMemberIndex, 1);
        selectedMemberIndex = null;
        saveTeamMembers();
        renderFolderStructure();
        clearMemberForm();
      }
    });
    document.getElementById('settingsBtn').addEventListener('click', () => {
      alert("Settings-Dialog (noch nicht implementiert)...");
    });
    document.getElementById('teamAccessBtn').addEventListener('click', () => {
      const container = document.getElementById('folderContainer');
      container.style.display = (container.style.display === "none") ? "block" : "none";
    });
    // Save-Button Event
    document.getElementById('saveButton').addEventListener('click', () => {
      if (selectedMemberIndex === null) {
        alert("Kein Mitglied ausgewählt!");
        return;
      }
      teamMembers[selectedMemberIndex].rank = document.getElementById('memberRank').value;
      teamMembers[selectedMemberIndex].info = document.getElementById('memberInfoField').value;
      teamMembers[selectedMemberIndex].weiteres = document.getElementById('memberWeiteres').value;
      saveTeamMembers();
      alert("Daten gespeichert!");
      renderFolderStructure();
    });
    
    document.getElementById('togglePasswordButton').addEventListener('click', function() {
      const pwInput = document.getElementById('memberPassword');
      if (pwInput.type === "password") {
        pwInput.type = "text";
        this.textContent = "Verbergen";
      } else {
        pwInput.type = "password";
        this.textContent = "Anzeigen";
      }
    });
    document.getElementById('copyPasswordButton').addEventListener('click', function() {
      const pwInput = document.getElementById('memberPassword');
      navigator.clipboard.writeText(pwInput.value).then(() => {
        alert("Passwort kopiert!");
      }).catch(err => {
        alert("Fehler beim Kopieren: " + err);
      });
    });
    
    // Logout-Funktionalität
    document.getElementById('logoutBtn').addEventListener('click', () => {
      document.getElementById('mainContainer').style.display = "none";
      document.getElementById('loginContainer').style.display = "flex";
      document.getElementById('loginName').value = "";
      document.getElementById('loginPassword').value = "";
      currentUserName = "";
    });

    // Refresh-Button: Seite neu laden
    document.getElementById('refreshButton').addEventListener('click', () => {
      location.reload();
    });
  </script>
</body>
</html>
